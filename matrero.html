<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matrero – Matrero Sailing Team</title>
<meta name="description" content="Matrero, Germán Frers' first design (1970). Gallery, regatta results and history of the Matrero Sailing Team.">
<meta name="theme-color" content="#0B1B2B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/photoswipe/photoswipe.css">
<link rel="stylesheet" href="css/matrero.css">
</head>
<body>

<header class="top" id="top">
  <a class="brand" href="index.html">Matrero <em>Sailing Team</em></a>
  <nav class="menu" id="menu" aria-label="Main">
    <a href="index.html" data-t="home"></a>
    <a href="#gallery" data-t="gallery"></a>
    <a href="#results" data-t="regatta"></a>
    <a href="#history" data-t="history"></a>
    <a href="contact.html" data-t="contact"></a>
  </nav>
  <div class="top-right">
    <div class="lang" role="group" aria-label="Language">
      <button type="button" class="lang-btn" data-lang="en">EN</button>
      <button type="button" class="lang-btn" data-lang="es">ES</button>
    </div>
    <button type="button" class="burger" id="burger" aria-controls="menu" aria-expanded="false" data-t-aria="menu"><span></span><span></span></button>
  </div>
</header>

<section class="hero">
  <img class="hero-img" src="images/a1d174e771fbe25ae38864d4098132be.jpg" alt="Matrero sailing past the old town of Saint-Tropez, 2024">
  <div class="hero-shade"></div>
  <div class="hero-body wrap">
    <p class="eyebrow">Germán Frers · 1970 · Club Náutico San Isidro</p>
    <h1>Matrero</h1>
    <p class="hero-intro" data-t="intro"></p>
    <dl class="specs">
      <div><dt data-t="sLaunch"></dt><dd>1971</dd></div>
      <div><dt data-t="sLength"></dt><dd>15 m</dd></div>
      <div><dt data-t="sBeam"></dt><dd>4 m</dd></div>
      <div><dt data-t="sClass"></dt><dd>Classic IOR</dd></div>
      <div class="wide"><dt data-t="sOwner"></dt><dd>Rafael Pereira Aragón</dd></div>
    </dl>
  </div>
  <a class="scroll-cue" href="#stats" data-t-aria="scroll"><span></span></a>
</section>

<section class="stats" id="stats">
  <div class="wrap stats-grid" id="stats-grid"></div>
</section>

<section class="gallery" id="gallery">
  <div class="wrap">
    <div class="sec-head">
      <div>
        <p class="kicker" data-t="galleryKicker"></p>
        <h2 data-t="gallery"></h2>
      </div>
      <a class="ig" href="https://www.instagram.com/matrero.sailing/" target="_blank" rel="noopener">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>
        @matrero.sailing
      </a>
    </div>
    <div class="chips" id="g-filters" role="tablist"></div>
    <div class="jg" id="g-grid"></div>
    <div class="g-more"><button type="button" class="btn-ghost" id="g-more"></button></div>
  </div>
</section>

<section class="results" id="results">
  <div class="wrap">
    <div class="sec-head">
      <div>
        <p class="kicker" data-t="resultsKicker"></p>
        <h2 data-t="regatta"></h2>
      </div>
    </div>
    <div class="seasons" id="r-tabs" role="tablist"></div>
    <p class="season-sum" id="r-sum"></p>
    <div class="rcards" id="r-cards"></div>

    <div class="honours">
      <div class="honours-head">
        <h3 data-t="honoursTitle"></h3>
        <p data-t="honoursSub"></p>
      </div>
      <div class="hboard" id="r-honours"></div>
    </div>
  </div>
</section>

<section class="history" id="history">
  <div class="wrap">
    <div class="sec-head">
      <div>
        <p class="kicker" data-t="historyKicker"></p>
        <h2 data-t="history"></h2>
      </div>
    </div>
    <ol class="era-nav" id="era-nav"></ol>
  </div>
  <div id="timeline"></div>
</section>

<footer class="foot">
  <div class="wrap foot-in">
    <div>
      <div class="brand">Matrero <em>Sailing Team</em></div>
      <p class="foot-sub">Club Náutico San Isidro · Argentina</p>
    </div>
    <div class="foot-links">
      <a href="https://www.instagram.com/matrero.sailing/" target="_blank" rel="noopener">Instagram</a>
      <a href="encounter.html">Encounter</a>
      <a href="contact.html" data-t="contact"></a>
    </div>
    <p class="foot-copy">© 2026 Matrero Sailing Team</p>
  </div>
</footer>

<script src="js/matrero-data.js"></script>
<script type="module" src="js/matrero.js"></script>
<script src="js/site.js"></script>
</body>
</html>
