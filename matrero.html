<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matrero – Gallery, Regatta, History</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A1622}
a{color:#0F4C75}a:hover{color:#0A1622}
.thumb{transition:opacity .25s, outline-color .25s}
.thumb:hover{opacity:.85}
.dd{position:relative}
.dd-menu{position:absolute;top:100%;left:0;min-width:230px;display:none;flex-direction:column;padding:8px;background:#0A1622;border:1px solid rgba(255,255,255,0.16);border-radius:4px;box-shadow:0 18px 40px rgba(0,0,0,0.35)}
.dd:hover .dd-menu,.dd:focus-within .dd-menu{display:flex}
.dd-menu a{padding:12px 14px;text-decoration:none;color:#FFFFFF;border-radius:3px}
.dd-menu a:hover{background:rgba(191,227,247,0.12);color:#FFFFFF}
.yr{position:sticky;top:84px}

.lang-btn{padding:10px 14px;min-width:44px;border:0;cursor:pointer;background:transparent;color:#FFFFFF;font:inherit;letter-spacing:inherit}
.lang-btn[aria-pressed="true"]{background:#FFFFFF;color:#0A1622}
</style>
</head>
<body>
<div style="font-family: Inter, system-ui, sans-serif; color: #0A1622; background: #FFFFFF">

<header style="position: absolute; top: 0; left: 0; right: 0; z-index: 6; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 28px clamp(20px, 5vw, 72px); background: linear-gradient(180deg, rgba(10,22,34,0.8) 0%, rgba(10,22,34,0) 100%)">
<a href="index.html" style="font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 600; letter-spacing: 0.04em; text-decoration: none; color: #FFFFFF">Matrero &amp; Encounter</a>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 20px">
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase">
<a href="index.html" style="padding: 12px 14px; text-decoration: none; color: #FFFFFF"><span data-t="home"></span></a>
<div class="dd">
<a href="matrero.html" aria-haspopup="true" style="display: inline-flex; align-items: center; gap: 6px; padding: 12px 14px; text-decoration: none; color: #FFFFFF; border-bottom: 1px solid #FFFFFF">Matrero <svg aria-hidden="true" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 3l4 4 4-4"/></svg></a>
<div class="dd-menu">
<a href="#results"><span data-t="resultsMenu"></span></a>
<a href="#history"><span data-t="history"></span></a>
</div>
</div>
<a href="encounter.html" style="padding: 12px 14px; text-decoration: none; color: #FFFFFF">Encounter</a>
<a href="contact.html" style="padding: 12px 14px; text-decoration: none; color: #FFFFFF"><span data-t="contact"></span></a>
</nav>
<div role="group" aria-label="Language" style="display: flex; border: 1px solid rgba(255,255,255,0.4); border-radius: 22px; overflow: hidden; font-size: 12px; font-weight: 600; letter-spacing: 0.1em">
<button type="button" class="lang-btn" data-lang="en">EN</button>
<button type="button" class="lang-btn" data-lang="es">ES</button>
</div>
</div>
</header>

<section style="position: relative; height: 760px; overflow: hidden; background: #0A1622; color: #FFFFFF">
<img src="images/a1d174e771fbe25ae38864d4098132be.jpg" alt="Matrero sailing past the old town of Saint-Tropez, 2024" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%">
<div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,22,34,0.2) 0%, rgba(10,22,34,0.1) 45%, rgba(10,22,34,0.85) 85%, #0A1622 100%)"></div>
<div style="position: absolute; left: clamp(20px, 5vw, 72px); right: clamp(20px, 5vw, 72px); bottom: 56px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 14px; max-width: 760px">
<div style="font-size: 13px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: #BFE3F7">Club Náutico San Isidro · Argentina</div>
<h1 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: clamp(80px, 12vw, 176px); line-height: 0.88; color: #FFFFFF">Matrero</h1>
<p style="margin: 0; font-size: 18px; line-height: 1.6; max-width: 600px; color: rgba(255,255,255,0.88)"><span data-t="intro"></span></p>
</div>
<dl style="margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px 32px; padding-top: 24px; border-top: 1px solid rgba(255,255,255,0.22)">
<div><dt style="font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #BFE3F7"><span data-t="sDesign"></span></dt><dd style="margin: 6px 0 0; font-size: 17px; font-weight: 500">Germán Frers, 1970</dd></div>
<div><dt style="font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #BFE3F7"><span data-t="sLaunch"></span></dt><dd style="margin: 6px 0 0; font-size: 17px; font-weight: 500">1971</dd></div>
<div><dt style="font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #BFE3F7"><span data-t="sLength"></span></dt><dd style="margin: 6px 0 0; font-size: 17px; font-weight: 500">15 m</dd></div>
<div><dt style="font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #BFE3F7"><span data-t="sBeam"></span></dt><dd style="margin: 6px 0 0; font-size: 17px; font-weight: 500">4 m</dd></div>
<div><dt style="font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #BFE3F7"><span data-t="sClass"></span></dt><dd style="margin: 6px 0 0; font-size: 17px; font-weight: 500">Classic IOR</dd></div>
<div><dt style="font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #BFE3F7"><span data-t="sOwner"></span></dt><dd style="margin: 6px 0 0; font-size: 17px; font-weight: 500">Rafael Pereira Aragón</dd></div>
</dl>
</div>
</section>

<nav aria-label="Matrero" style="position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 10px 20px; background: #0A1622; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 13px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase">
<a href="#gallery" style="padding: 14px 20px; color: #FFFFFF; text-decoration: none"><span data-t="gallery"></span></a>
<a href="#results" style="padding: 14px 20px; color: #FFFFFF; text-decoration: none"><span data-t="regatta"></span></a>
<a href="#history" style="padding: 14px 20px; color: #FFFFFF; text-decoration: none"><span data-t="history"></span></a>
</nav>

<section id="gallery" style="background: #0A1622; color: #FFFFFF; padding: 96px clamp(20px, 5vw, 72px)">
<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
<h2 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 72px; line-height: 1"><span data-t="gallery"></span></h2>
<a href="https://www.instagram.com/matrero.sailing/" style="color: #BFE3F7; font-size: 14px; font-weight: 500; padding: 12px 0">Instagram @matrero.sailing</a>
</div>

<div style="position: relative; height: 620px; background: #06101A; border-radius: 4px; overflow: hidden">
<img id="slide-img" src="" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain">
<button type="button" id="prev" data-t-aria="prev" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 52px; height: 52px; border-radius: 26px; border: 1px solid rgba(255,255,255,0.4); background: rgba(10,22,34,0.6); color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 3L5 9l6 6"/></svg></button>
<button type="button" id="next" data-t-aria="next" style="position: absolute; right: 16px; top: 50%; transform: translateY(-50%); width: 52px; height: 52px; border-radius: 26px; border: 1px solid rgba(255,255,255,0.4); background: rgba(10,22,34,0.6); color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3l6 6-6 6"/></svg></button>
<div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; padding: 40px 24px 20px; background: linear-gradient(180deg, rgba(6,16,26,0) 0%, rgba(6,16,26,0.9) 100%); font-size: 15px">
<span id="slide-cap"></span>
<span id="slide-count" style="color: #BFE3F7; font-variant-numeric: tabular-nums"></span>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px" id="grid"></div>
</div>
</section>

<section id="results" style="background: #FFFFFF; padding: 112px clamp(20px, 5vw, 72px)">
<div style="max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 56px">
<h2 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 72px; line-height: 1"><span data-t="regatta"></span></h2>

<div style="display: flex; flex-direction: column; gap: 40px; border-left: 2px solid #DCE6EE; margin-left: 8px; padding-left: clamp(24px, 4vw, 48px)" id="results-list"></div>
</div>
</section>

<section id="history" style="background: #0A1622; color: #FFFFFF; padding: 120px 0 80px">
<div style="max-width: 1200px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 72px)">
<h2 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 72px; line-height: 1"><span data-t="history"></span></h2>
</div>

<div id="eras"></div>
</section>

<footer style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; padding: 28px clamp(20px, 5vw, 72px) 36px; background: #0A1622; border-top: 1px solid rgba(255,255,255,0.12); font-size: 14px; color: rgba(255,255,255,0.72)">
<span>© 2026 Matrero &amp; Encounter Racing</span>
<div style="display: flex; flex-wrap: wrap; gap: 24px">
<a href="https://www.instagram.com/matrero.sailing/" style="text-decoration: none; color: #FFFFFF">Instagram @matrero.sailing</a>
<a href="encounter.html" style="text-decoration: none; color: #FFFFFF">Encounter</a>
<a href="contact.html" style="text-decoration: none; color: #FFFFFF"><span data-t="contact"></span></a>
</div>
</footer>
</div>
<script src="js/site.js"></script>
<script src="js/matrero.js"></script>
</body>
</html>
